# ============================================
# Docker Compose - Subscription Credit System
# ============================================
# 
# This file defines the complete stack:
# - PostgreSQL database
# - Subscription API
# - Optional: pgAdmin for database management
#
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Stop:        docker-compose down
#   Clean:       docker-compose down -v (removes volumes)
#

version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: subscription-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-subscription_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subscription_pass}
      POSTGRES_DB: ${DB_NAME:-subscription_credit_system}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subscription_user} -d ${DB_NAME:-subscription_credit_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - subscription-network

  # ============================================
  # Subscription API
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: subscription-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-subscription_user}:${DB_PASSWORD:-subscription_pass}@db:5432/${DB_NAME:-subscription_credit_system}?schema=public&connection_limit=10
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # Payment Gateway
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      
      # Email/SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Mount prisma directory for migrations
      - ./prisma:/app/prisma:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - subscription-network
    command: >
      sh -c "
        echo '🔄 Running database migrations...' &&
        npx prisma migrate deploy &&
        echo '✅ Migrations complete' &&
        echo '🚀 Starting application...' &&
        node dist/index.js
      "

  # ============================================
  # pgAdmin (Optional - for database management)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: subscription-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - subscription-network

# ============================================
# Networks
# ============================================
networks:
  subscription-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
