<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Imagem indisponível</title>
  <desc id="description">Fallback visual da Ordax para itens sem imagem publicada.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#c99b45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#c99b45" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="#050505"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <rect x="150" y="150" width="900" height="900" rx="24" fill="none" stroke="#c99b45" stroke-opacity=".35" stroke-width="4"/>
  <g transform="translate(600 520)" fill="none" stroke="#c99b45" stroke-width="10">
    <rect x="-180" y="-140" width="360" height="280" rx="20"/>
    <circle cx="-70" cy="-45" r="32"/>
    <path d="M-145 105l105-100 72 68 55-50 92 82"/>
  </g>
  <text x="600" y="790" text-anchor="middle" fill="#d7ab4e" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="14">ORDAX</text>
  <text x="600" y="860" text-anchor="middle" fill="#777" font-family="Arial, sans-serif" font-size="28" letter-spacing="5">IMAGEM INDISPONÍVEL</text>
</svg>
