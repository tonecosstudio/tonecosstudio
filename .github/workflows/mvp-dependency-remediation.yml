name: MVP Dependency Remediation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mvp-dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh production dependency graph
        run: |
          npm install --save-dev @imgly/background-removal-node@^1.4.5 postcss@^8.5.26
          npm install --save-exact sharp@0.35.4 dompurify@3.4.14 react-router-dom@7.18.3 react-router@7.18.3

      - name: Migrate React Router v7 compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/App.tsx")
          text = path.read_text()
          legacy = '''      <BrowserRouter
        future={{
          v7_startTransition: true,
          v7_relativeSplatPath: true,
        }}
      >'''
          if legacy not in text:
              raise SystemExit("Expected React Router v6 future flags were not found")
          path.write_text(text.replace(legacy, "      <BrowserRouter>"))
          PY
          npx prettier --write src/App.tsx

      - name: Verify application after dependency updates
        run: |
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit verified remediation
        run: |
          if git diff --quiet -- package.json package-lock.json src/App.tsx; then
            echo "Dependency graph already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/App.tsx
          git commit -m "fix: remediate production dependency vulnerabilities"
          git push origin HEAD:main
