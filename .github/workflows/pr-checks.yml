name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
      
      - name: Check for large files
        run: |
          find . -type f -size +5M -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            echo "❌ Large file detected: $file"
            exit 1
          done
      
      - name: Check for TODO comments
        run: |
          TODO_COUNT=$(grep -r "TODO\|FIXME\|HACK\|XXX" src/ --exclude-dir=node_modules --exclude-dir=dist | wc -l)
          echo "📝 Found $TODO_COUNT TODO/FIXME comments"
          if [ $TODO_COUNT -gt 50 ]; then
            echo "⚠️ Warning: High number of TODO comments ($TODO_COUNT)"
          fi
      
      - name: Check bundle size
        run: |
          npm run build
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "📦 Bundle size: $BUNDLE_SIZE"
