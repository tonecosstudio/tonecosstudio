name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'services/catalogo/**'
      - 'config/catalog-code-consolidation.json'
      - 'scripts/architecture/catalog-monorepo.test.mjs'
      - 'scripts/cloudflare/catalog-pages-proxy.test.mjs'
      - 'functions/catalogo-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request'
    name: Build, test and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(git diff --name-only -z --diff-filter=ACMR HEAD^ HEAD)
          prettier_files=()

          for file in "${changed_files[@]}"; do
            if [[ "$file" == src/*.ts || "$file" == src/*.tsx || "$file" == src/*.json || "$file" == src/*.md ]]; then
              prettier_files+=("$file")
            elif [[ "$file" != */* && ( "$file" == *.json || "$file" == *.md ) ]]; then
              prettier_files+=("$file")
            fi
          done

          if (( ${#prettier_files[@]} == 0 )); then
            echo "No changed files in the repository's Prettier scope."
            exit 0
          fi

          printf 'Checking formatting for:\n - %s\n' "${prettier_files[@]}"
          npx prettier --check "${prettier_files[@]}"

  unit:
    if: github.event_name != 'pull_request'
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test with coverage thresholds
        run: npm run test:coverage

  build:
    if: github.event_name != 'pull_request'
    name: Production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  authority:
    if: github.event_name != 'pull_request'
    name: Authority audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Supabase boundaries
        if: always()
        run: npm run security:supabase-access

      - name: Audit generated Supabase types SSOT
        if: always()
        run: npm run security:supabase-types

      - name: Audit canonical pricing read authority
        if: always()
        run: npm run security:pricing-read-authority

      - name: Audit profile authority
        if: always()
        run: node scripts/security/audit-profile-authority.mjs

      - name: Audit notification authority
        if: always()
        run: node scripts/security/audit-notification-authority.mjs

      - name: Audit public system settings authority
        if: always()
        run: node scripts/security/audit-public-settings-authority.mjs

      - name: Audit fail-closed upload scanner
        if: always()
        run: node scripts/security/audit-secure-upload-scanner.mjs

      - name: Audit commercial authority
        if: always()
        run: node scripts/security/audit-commercial-authority.mjs

  catalog-offline:
    name: Catalog Worker offline / no deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify monorepo ownership and Git blobs
        run: npm run catalog:monorepo:check

      - name: Typecheck Worker
        run: npm run catalog:worker:typecheck

      - name: Test Worker runtime offline
        run: npm run catalog:worker:test

      - name: Test catalog search and SQLite locally
        run: npm run catalog:worker:search:test

      - name: Test Pages proxy offline
        run: node --test scripts/cloudflare/catalog-pages-proxy.test.mjs
