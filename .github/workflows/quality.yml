name: Quality Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  unit:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test with coverage thresholds
        run: npm run test:coverage

  build:
    name: Production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  authority:
    name: Authority audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Supabase boundaries
        if: always()
        run: npm run security:supabase-access

      - name: Audit profile authority
        if: always()
        run: node scripts/security/audit-profile-authority.mjs

      - name: Audit notification authority
        if: always()
        run: node scripts/security/audit-notification-authority.mjs

      - name: Audit public system settings authority
        if: always()
        run: node scripts/security/audit-public-settings-authority.mjs

      - name: Audit fail-closed upload scanner
        if: always()
        run: node scripts/security/audit-secure-upload-scanner.mjs

      - name: Audit commercial authority
        if: always()
        run: node scripts/security/audit-commercial-authority.mjs
