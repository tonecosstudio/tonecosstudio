name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'services/catalogo/**'
      - 'config/catalog-code-consolidation.json'
      - 'scripts/architecture/catalog-monorepo.test.mjs'
      - 'scripts/catalog/cutover-readiness*.mjs'
      - 'scripts/catalog/*specialstl*.mjs'
      - 'scripts/cloudflare/catalog-pages-proxy.test.mjs'
      - 'functions/catalogo-api/**'
      - 'api/catalogo-proxy.js'
      - 'vercel.json'
      - 'scripts/vercel/catalog-proxy.test.mjs'
      - 'src/PublicCatalogApp.tsx'
      - 'src/config/canonical-catalog-endpoint*'
      - 'src/services/catalog/public-catalog-gateway*'
      - 'src/services/catalog/specialstl-quarantine.json'
      - 'src/pages/CatalogModelsArcade*'
      - 'src/pages/catalog/CanonicalModelDetails*'
      - 'src/pages/LandingPage*'
      - 'src/components/catalog/**'
      - 'public/_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request'
    name: Build, test and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(git diff --name-only -z --diff-filter=ACMR HEAD^ HEAD)
          prettier_files=()

          for file in "${changed_files[@]}"; do
            if [[ "$file" == src/*.ts || "$file" == src/*.tsx || "$file" == src/*.json || "$file" == src/*.md ]]; then
              prettier_files+=("$file")
            elif [[ "$file" != */* && ( "$file" == *.json || "$file" == *.md ) ]]; then
              prettier_files+=("$file")
            fi
          done

          if (( ${#prettier_files[@]} == 0 )); then
            echo "No changed files in the repository's Prettier scope."
            exit 0
          fi

          printf 'Checking formatting for:\n - %s\n' "${prettier_files[@]}"
          npx prettier --check "${prettier_files[@]}"

  unit:
    if: github.event_name != 'pull_request'
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test with coverage thresholds
        run: npm run test:coverage

  build:
    if: github.event_name != 'pull_request'
    name: Production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  authority:
    if: github.event_name != 'pull_request'
    name: Authority audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Supabase boundaries
        if: always()
        run: npm run security:supabase-access

      - name: Audit generated Supabase types SSOT
        if: always()
        run: npm run security:supabase-types

      - name: Audit canonical pricing read authority
        if: always()
        run: npm run security:pricing-read-authority

      - name: Audit profile authority
        if: always()
        run: node scripts/security/audit-profile-authority.mjs

      - name: Audit notification authority
        if: always()
        run: node scripts/security/audit-notification-authority.mjs

      - name: Audit public system settings authority
        if: always()
        run: node scripts/security/audit-public-settings-authority.mjs

      - name: Audit fail-closed upload scanner
        if: always()
        run: node scripts/security/audit-secure-upload-scanner.mjs

      - name: Audit commercial authority
        if: always()
        run: node scripts/security/audit-commercial-authority.mjs

  catalog-offline:
    name: Catalog Worker offline / no deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Validate the read-only MVP before the independent backend ownership
      # gate; a stale backend pin must not suppress frontend test evidence.
      - name: Test public MVP and SpecialSTL offline curation
        run: |
          npm run catalog:mvp:test
          node --test scripts/catalog/build-specialstl-review-sheet.test.mjs scripts/catalog/propose-specialstl-quarantine.test.mjs

      - name: Verify monorepo ownership and Git blobs
        run: npm run catalog:monorepo:check

      - name: Typecheck Worker
        run: npm run catalog:worker:typecheck

      - name: Test Worker runtime offline
        run: npm run catalog:worker:test

      - name: Test catalog search and SQLite locally
        run: npm run catalog:worker:search:test

      - name: Test Pages proxy offline
        run: node --test scripts/cloudflare/catalog-pages-proxy.test.mjs scripts/vercel/catalog-proxy.test.mjs

      - name: Validate cutover gate fail-closed without network
        run: node --test scripts/catalog/cutover-readiness.test.mjs

      # The canonical TONART launch PR requires release:verify before a
      # production promotion. Reuse this existing PR job instead of creating
      # additional workflows or running the full suite on unrelated PRs.
      - name: Verify canonical TONART release candidate
        if: github.event.pull_request.number == 4 && github.head_ref == 'integration/tonecosstudio-canonical-20261101'
        run: npm run release:verify

  # The same quality workflow owns the target release; no parallel writer.
  # Manual main-only activation is blocked until M5 live preflight proves that
  # the original Washington workflow is disabled and all gates are attested.
  catalog-cutover-release:
    name: Existing Cloudflare Worker — controlled M5 handoff
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WORKER_VERSION_TAG: tonart-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout canonical TONART main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend and backend test dependencies
        run: npm ci

      - name: Verify exact authority and single-writer cutover gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CATALOG_API_URL"
          test -n "$TURNSTILE_SECRET_KEY"
          node scripts/catalog/cutover-readiness.mjs --live

      - name: Verify canonical Worker source and offline runtime
        run: |
          npm run catalog:monorepo:check
          npm run catalog:worker:typecheck
          npm run catalog:worker:test

      # Wrangler's release version is pinned exactly to the current known-good
      # original publisher. CI does not add a second package.json or lockfile.
      - name: Install pinned Worker publisher (release job only)
        run: npm install --no-save --package-lock=false wrangler@4.155.0

      - name: Render exact existing Worker and check remote bindings
        working-directory: services/catalogo
        run: |
          set -euo pipefail
          node tools/render_wrangler_config.mjs
          node tools/check_remote_worker_config.mjs --allow-cors-expansion
          previous="$(node tools/cloudflare_deploy_state.mjs active-version)"
          echo "PREVIOUS_WORKER_VERSION_ID=$previous" >> "$GITHUB_ENV"
          npx wrangler r2 bucket info tonecos-catalogo-media --json

      - name: Upload candidate without traffic or D1 migrations
        working-directory: services/catalogo
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/tonart-worker-upload.ndjson
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/tonart-worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node -e "const fs=require('node:fs');fs.writeFileSync(process.argv[1], JSON.stringify({ TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY }), { mode:0o600 })" "$secret_file"
          npx wrangler versions upload \
            --tag "$WORKER_VERSION_TAG" \
            --message "tonart ${GITHUB_SHA}" \
            --secrets-file "$secret_file" \
            --config .wrangler.deploy.jsonc
          staged="$(node tools/cloudflare_deploy_state.mjs uploaded-version "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "STAGED_WORKER_VERSION_ID=$staged" >> "$GITHUB_ENV"

      - name: Register candidate at 0% traffic
        id: stage
        working-directory: services/catalogo
        run: >-
          npx wrangler versions deploy
          "${PREVIOUS_WORKER_VERSION_ID}@100%"
          "${STAGED_WORKER_VERSION_ID}@0%"
          --message "tonart staged ${GITHUB_SHA}"
          --yes --config .wrangler.deploy.jsonc

      - name: Smoke new version before promotion
        working-directory: services/catalogo
        run: node tools/check_staged_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"

      - name: Promote one Worker version
        working-directory: services/catalogo
        run: >-
          npx wrangler versions deploy
          "${STAGED_WORKER_VERSION_ID}@100%"
          --message "tonart ${GITHUB_SHA}"
          --yes --config .wrangler.deploy.jsonc

      - name: Verify production, canonical media and Cache HIT
        working-directory: services/catalogo
        run: |
          node tools/check_remote_worker_config.mjs
          node tools/check_promoted_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"
          python tools/verify_public_catalog.py --api-base "$CATALOG_API_URL"
          node tools/check_public_catalog_hierarchy.mjs "$CATALOG_API_URL"
          node tools/check_worker_cache_hit.mjs "$CATALOG_API_URL"

      - name: Restore previous version on failed promotion or smoke
        if: ${{ failure() && steps.stage.outcome == 'success' }}
        working-directory: services/catalogo
        run: >-
          npx wrangler rollback "$PREVIOUS_WORKER_VERSION_ID"
          --message "tonart rollback after failed validation ${GITHUB_SHA}"
          --config .wrangler.deploy.jsonc
