name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'services/catalogo/**'
      - 'config/catalog-code-consolidation.json'
      - 'scripts/architecture/catalog-monorepo.test.mjs'
      - 'scripts/catalog/cutover-readiness*.mjs'
      - 'scripts/catalog/*specialstl*.mjs'
      - 'scripts/cloudflare/catalog-pages-proxy.test.mjs'
      - 'functions/catalogo-api/**'
      - 'api/catalogo-proxy.js'
      - 'vercel.json'
      - 'scripts/vercel/catalog-proxy.test.mjs'
      - 'src/PublicCatalogApp.tsx'
      - 'src/App.tsx'
      - 'src/TonecosCommercialApp.tsx'
      - 'src/TonecosCommercialApp*.test.tsx'
      - 'src/main.tsx'
      - 'src/config/routes.ts'
      - 'src/config/routes.test.ts'
      - 'src/config/canonical-catalog-endpoint*'
      - 'src/config/supabase-environment*'
      - 'src/config/tonecos-commercial-authority*'
      - 'src/services/catalog/public-catalog-gateway*'
      - 'src/services/catalog/specialstl-quarantine.json'
      - 'src/services/customer/**'
      - 'src/services/auth/**'
      - 'src/services/coins/**'
      - 'src/services/quotes/**'
      - 'src/services/admin/**'
      - 'src/services/payments/**'
      - 'src/services/subscriptions/**'
      - 'src/services/commercial/**'
      - 'supabase/migrations/**'
      - 'src/pages/CatalogModelsArcade*'
      - 'src/pages/PlansArcade*'
      - 'src/pages/SubscribeCollection.tsx'
      - 'src/pages/__tests__/SubscribeCollection*'
      - 'src/pages/admin/collections/**'
      - 'src/pages/admin/plans/**'
      - 'src/pages/admin/production/**'
      - 'src/pages/admin/users/**'
      - 'src/pages/catalog/CanonicalModelDetails*'
      - 'src/pages/commercial/**'
      - 'src/pages/LandingPage*'
      - 'src/pages/TermsArcade*'
      - 'src/pages/PrivacyArcade*'
      - 'src/pages/LegalArcade*'
      - 'src/components/catalog/**'
      - 'src/components/arcade/CollectorBenefits.test.tsx'
      - 'src/components/admin/collections/SubscriptionCollectionCuration.tsx'
      - 'src/components/subscription/**'
      - 'src/hooks/admin/useAdminPlansConfiguration.ts'
      - 'src/hooks/subscription/**'
      - 'src/integrations/supabase/tonecos-mvp.types.ts'
      - 'src/types/coins.ts'
      - 'public/_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Run the full quality gate or the read-only M5 ownership check
        required: true
        type: choice
        options:
          - verify
          - m5-ownership
          - worker-release
          - m5-schema
        default: verify
      m5_ack:
        description: Confirm the owner-authorized M5 D1 0028-0033 migration scope
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Manual M5 ownership inspections never cancel (or get cancelled by) push CI.
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'worker-release' || inputs.operation == 'm5-schema') && 'tonart-catalog-production-writer' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'm5-ownership' && 'tonart-catalog-m5-ownership' || format('quality-{0}-{1}', github.workflow, github.ref)) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' }}

jobs:
  quality:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify')
    name: Build, test and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(git diff --name-only -z --diff-filter=ACMR HEAD^ HEAD)
          prettier_files=()

          for file in "${changed_files[@]}"; do
            if [[ "$file" == src/*.ts || "$file" == src/*.tsx || "$file" == src/*.json || "$file" == src/*.md ]]; then
              prettier_files+=("$file")
            elif [[ "$file" != */* && ( "$file" == *.json || "$file" == *.md ) ]]; then
              prettier_files+=("$file")
            fi
          done

          if (( ${#prettier_files[@]} == 0 )); then
            echo "No changed files in the repository's Prettier scope."
            exit 0
          fi

          printf 'Checking formatting for:\n - %s\n' "${prettier_files[@]}"
          if ! npx prettier --check "${prettier_files[@]}"; then
            echo "::group::Suggested formatting changes (first 1000 lines)"
            npx prettier --write "${prettier_files[@]}" > /dev/null
            git --no-pager diff -- "${prettier_files[@]}" | sed -n '1,1000p'
            echo "::endgroup::"
            echo "::error::Format the listed files with npx prettier --write before merging."
            exit 1
          fi

  unit:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify')
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Test with coverage thresholds
        run: npm run test:coverage

  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify')
    name: Production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  authority:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify')
    name: Authority audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Audit Supabase boundaries
        if: always()
        run: npm run security:supabase-access

      - name: Audit generated Supabase types SSOT
        if: always()
        run: npm run security:supabase-types

      - name: Audit canonical pricing read authority
        if: always()
        run: npm run security:pricing-read-authority

      - name: Audit profile authority
        if: always()
        run: node scripts/security/audit-profile-authority.mjs

      - name: Audit notification authority
        if: always()
        run: node scripts/security/audit-notification-authority.mjs

      - name: Audit public system settings authority
        if: always()
        run: node scripts/security/audit-public-settings-authority.mjs

      - name: Audit fail-closed upload scanner
        if: always()
        run: node scripts/security/audit-secure-upload-scanner.mjs

      - name: Test M5 controlled Worker release evidence offline
        run: node --test services/catalogo/tools/test_controlled_worker_release.mjs
      - name: Test staged commercial editorial contract offline
        run: node --test scripts/catalog/catalog-editorial-contract.test.mjs

      - name: Audit commercial authority
        if: always()
        run: node scripts/security/audit-commercial-authority.mjs

  catalog-offline:
    name: Catalog Worker offline / no deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      # Validate the read-only MVP before the independent backend ownership
      # gate; a stale backend pin must not suppress frontend test evidence.
      - name: Test public MVP, commercial rules and SpecialSTL offline curation
        run: |
          npm run catalog:mvp:test
          npm run catalog:commerce:test
          node --test scripts/catalog/build-specialstl-review-sheet.test.mjs scripts/catalog/propose-specialstl-quarantine.test.mjs

      - name: Verify monorepo ownership and Git blobs
        run: npm run catalog:monorepo:check

      - name: Typecheck TONART admin editor
        run: npm run typecheck:app

      - name: Test TONART admin continuous curation
        run: npx vitest run src/pages/commercial/TonartTelegramDrafts.test.tsx

      - name: Test TONART index navigation contract
        run: node --test scripts/catalog/tonart-telegram-navigation.test.mjs

      - name: Typecheck Worker
        run: npm run catalog:worker:typecheck

      - name: Test Worker runtime offline
        run: npm run catalog:worker:test

      - name: Test catalog search and SQLite locally
        run: npm run catalog:worker:search:test

      - name: Test Pages proxy offline
        run: node --test scripts/cloudflare/catalog-pages-proxy.test.mjs scripts/vercel/catalog-proxy.test.mjs

      - name: Validate cutover gate fail-closed without network
        run: node --test scripts/catalog/cutover-readiness.test.mjs

      # The canonical TONART launch PR requires release:verify before a
      # production promotion. Reuse this existing PR job instead of creating
      # additional workflows or running the full suite on unrelated PRs.
      - name: Verify canonical TONART release candidate
        if: github.event.pull_request.number == 4 && github.head_ref == 'integration/tonecosstudio-canonical-20261101'
        run: npm run release:verify

  # Existing workflow, no second production pipeline: GitHub metadata only.
  # No Cloudflare token, D1 query, Worker deployment or migration is possible.
  catalog-m5-ownership:
    name: M5 ownership (read-only, fail-closed)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'm5-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Inspect source writers and canonical M5 owner (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog/cutover-readiness.mjs --ownership-only

  # This existing Quality Gate remains the only TONART production publisher.
  # No new Worker, D1, R2 or workflow. Blocked until explicit M5 live GO.
  catalog-controlled-worker-release:
    name: Controlled M5 handoff — existing Worker
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'worker-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: https://tonecos-catalogo-api.tonecosstudio.workers.dev
      WRANGLER_CONFIG: services/catalogo/wrangler.jsonc
      RELEASE_TAG: tonart-m5-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact TONART main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Require explicit M5 GO and verify all five original writers disabled
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/catalog/cutover-readiness.mjs --live

      - name: Verify unchanged production version before upload
        run: |
          set -euo pipefail
          previous="$(node services/catalogo/tools/controlled_worker_release.mjs before)"
          echo "ROLLBACK_PREVIOUS_VERSION=$previous" >> "$GITHUB_ENV"

      - name: Verify current Worker source and pinned Wrangler
        run: |
          set -euo pipefail
          npm ci --onnxruntime-node-install-cuda=skip
          npm run catalog:monorepo:check
          npm run catalog:worker:typecheck
          npm run catalog:worker:test
          node --test services/catalogo/tools/test_controlled_worker_release.mjs
          npm install --no-save --package-lock=false wrangler@4.155.0

      - name: Upload candidate version without changing traffic
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/tonart-m5-upload.ndjson
        run: |
          set -euo pipefail
          npx wrangler versions upload --tag "$RELEASE_TAG" \
            --message "TONART M5 ${{ github.sha }}" --keep-vars --config "$WRANGLER_CONFIG"
          candidate="$(node services/catalogo/tools/controlled_worker_release.mjs uploaded "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "STAGED_WORKER_VERSION=$candidate" >> "$GITHUB_ENV"

      - name: Stage new version at zero percent
        id: stage
        run: >-
          npx wrangler versions deploy
          "${ROLLBACK_PREVIOUS_VERSION}@100%"
          "${STAGED_WORKER_VERSION}@0%"
          --message "TONART M5 0% ${{ github.sha }}"
          --yes --config "$WRANGLER_CONFIG"

      - name: Verify staged version by exact Cloudflare version override
        run: node services/catalogo/tools/controlled_worker_release.mjs staged "$ROLLBACK_PREVIOUS_VERSION" "$STAGED_WORKER_VERSION"

      - name: Promote validated candidate
        run: >-
          npx wrangler versions deploy
          "${STAGED_WORKER_VERSION}@100%"
          --message "TONART M5 ${{ github.sha }}"
          --yes --config "$WRANGLER_CONFIG"

      - name: Verify promoted Worker and public read routes
        run: node services/catalogo/tools/controlled_worker_release.mjs promoted "$STAGED_WORKER_VERSION"

      - name: Restore verified previous version after any partial stage or promotion failure
        if: ${{ (failure() || cancelled()) && (steps.stage.outcome == 'success' || steps.stage.outcome == 'failure') }}
        run: |
          set -euo pipefail
          previous="${ROLLBACK_PREVIOUS_VERSION:?Rollback version not verified}"
          # If metadata is unavailable, still attempt recovery to the exact
          # version that was validated before upload. Never claim success on error.
          if ! plan="$(node services/catalogo/tools/controlled_worker_release.mjs rollback-plan "$previous")"; then
            echo "::warning::Unable to read deployment; attempting recovery to the verified previous version."
            plan="restore"
          fi
          if [[ "$plan" == "restore" ]]; then
            npx wrangler versions deploy "$previous@100%" \
              --message "TONART M5 rollback ${{ github.sha }}" \
              --yes --config "$WRANGLER_CONFIG"
          elif [[ "$plan" != "no-op" ]]; then
            echo "::error::Invalid rollback decision."
            exit 2
          fi
          node services/catalogo/tools/controlled_worker_release.mjs rollback-verify "$previous"

  # Same Quality Gate; canonical D1. No second publisher or DB.
  # A strictly bounded six-file view avoids accidentally applying 0034+.
  catalog-m5-d1-schema:
    name: Authorized M5 D1 0028-0033 (bounded)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'm5-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      M5_OPERATION: ${{ inputs.operation }}
      M5_ACK: ${{ inputs.m5_ack }}
      M5_STAGE_DIR: tonart-m5-d1-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Offline M5 migration scope tests
        run: node --test scripts/catalog/m5-d1-bounded-release.test.mjs scripts/catalog/cutover-readiness.test.mjs
      - name: Require exact GO, disabled source writers, D1 bookmark and live ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "8827c547d6def5ee5b9ca550fdd5680a"
          test "$M5_ACK" = "GO-M5-0028-0033-20261125"
          node scripts/catalog/m5-d1-bounded-release.mjs prepare "$RUNNER_TEMP/$M5_STAGE_DIR"
      - name: Apply ONLY verified 0028-0033 through canonical Wrangler D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.155.0 d1 migrations apply DB --remote \
            --config "$RUNNER_TEMP/$M5_STAGE_DIR/wrangler-d1.jsonc" --yes
      - name: Verify exact ledger, schema objects and preserved catalog counts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/catalog/m5-d1-bounded-release.mjs verify "$RUNNER_TEMP/$M5_STAGE_DIR"
