name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - 'services/catalogo/**'
      - 'config/catalog-code-consolidation.json'
      - 'scripts/architecture/catalog-monorepo.test.mjs'
      - 'scripts/catalog/cutover-readiness*.mjs'
      - 'scripts/catalog/apply-approved-editorial*.mjs'
      - 'scripts/catalog/catalog-editorial*.mjs'
      - 'api/catalog-editorial.js'
      - 'src/pages/commercial/TonartAdminCatalogReview*'
      - 'src/pages/commercial/TonecosAdminHomePage*'
      - 'src/services/admin/overview/tonart-admin-workspace-service*'
      - 'scripts/catalog/*specialstl*.mjs'
      - 'scripts/cloudflare/catalog-pages-proxy.test.mjs'
      - 'functions/catalogo-api/**'
      - 'api/catalogo-proxy.js'
      - 'vercel.json'
      - 'scripts/vercel/catalog-proxy.test.mjs'
      - 'src/PublicCatalogApp.tsx'
      - 'src/config/canonical-catalog-endpoint*'
      - 'src/services/catalog/public-catalog-gateway*'
      - 'src/services/catalog/specialstl-quarantine.json'
      - 'src/pages/CatalogModelsArcade*'
      - 'src/pages/catalog/CanonicalModelDetails*'
      - 'src/pages/LandingPage*'
      - 'src/components/catalog/**'
      - 'public/_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Choose the single authorized TONART publisher operation
        required: true
        type: choice
        options:
          - worker-release
          - data-batch-release
        default: worker-release
      batch:
        description: Reviewed batch descriptor under services/catalogo/config/external-batches
        required: false
        type: string
        default: config/external-batches/external-source-001-batch-012.json
      apply:
        description: False runs preflight only; true applies an approved batch to existing D1/R2
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A merged editorial PR and a manual Worker deploy share ONE writer lock.
  # A regular main push can never cancel or interleave a production write.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'editorial/tonart-admin-review')) && 'tonart-catalog-production-writer' || format('quality-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'editorial/tonart-admin-review') }}

jobs:
  quality:
    if: github.event_name == 'push'
    name: Build, test and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(git diff --name-only -z --diff-filter=ACMR HEAD^ HEAD)
          prettier_files=()

          for file in "${changed_files[@]}"; do
            if [[ "$file" == src/*.ts || "$file" == src/*.tsx || "$file" == src/*.json || "$file" == src/*.md ]]; then
              prettier_files+=("$file")
            elif [[ "$file" != */* && ( "$file" == *.json || "$file" == *.md ) ]]; then
              prettier_files+=("$file")
            fi
          done

          if (( ${#prettier_files[@]} == 0 )); then
            echo "No changed files in the repository's Prettier scope."
            exit 0
          fi

          printf 'Checking formatting for:\n - %s\n' "${prettier_files[@]}"
          npx prettier --check "${prettier_files[@]}"

  unit:
    if: github.event_name == 'push'
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test with coverage thresholds
        run: npm run test:coverage

  build:
    if: github.event_name == 'push'
    name: Production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  authority:
    if: github.event_name == 'push'
    name: Authority audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Supabase boundaries
        if: always()
        run: npm run security:supabase-access

      - name: Audit generated Supabase types SSOT
        if: always()
        run: npm run security:supabase-types

      - name: Audit canonical pricing read authority
        if: always()
        run: npm run security:pricing-read-authority

      - name: Audit profile authority
        if: always()
        run: node scripts/security/audit-profile-authority.mjs

      - name: Audit notification authority
        if: always()
        run: node scripts/security/audit-notification-authority.mjs

      - name: Audit public system settings authority
        if: always()
        run: node scripts/security/audit-public-settings-authority.mjs

      - name: Audit fail-closed upload scanner
        if: always()
        run: node scripts/security/audit-secure-upload-scanner.mjs

      - name: Audit commercial authority
        if: always()
        run: node scripts/security/audit-commercial-authority.mjs

  catalog-offline:
    name: Catalog Worker offline / no deploy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Validate the read-only MVP before the independent backend ownership
      # gate; a stale backend pin must not suppress frontend test evidence.
      - name: Test public MVP and SpecialSTL offline curation
        run: |
          npm run catalog:mvp:test
          node --test scripts/catalog/build-specialstl-review-sheet.test.mjs scripts/catalog/propose-specialstl-quarantine.test.mjs

      - name: Verify monorepo ownership and Git blobs
        run: npm run catalog:monorepo:check

      - name: Typecheck Worker
        run: npm run catalog:worker:typecheck

      - name: Test Worker runtime offline
        run: npm run catalog:worker:test

      - name: Test catalog search and SQLite locally
        run: npm run catalog:worker:search:test

      - name: Test Pages proxy offline
        run: node --test scripts/cloudflare/catalog-pages-proxy.test.mjs scripts/vercel/catalog-proxy.test.mjs

      - name: Validate cutover gate fail-closed without network
        run: node --test scripts/catalog/cutover-readiness.test.mjs

      - name: Test approved editorial D1 plan and atomic SQL offline
        run: node --test scripts/catalog/apply-approved-editorial.test.mjs

      # The staged source Python code must be import-complete. This is a cheap
      # static verification; it never connects to the original writer or D1/R2.
      - name: Verify migrated data writer import closure offline
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import sys
          root = pathlib.Path('services/catalogo/tools')
          third_party = {'PIL', 'boto3', 'botocore'}
          files = sorted(root.glob('*.py'))
          assert len(files) >= 25, f'Incomplete data writer import: {len(files)} Python tools'
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      modules = [alias.name.split('.')[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      modules = [node.module.split('.')[0]]
                  else:
                      continue
                  for module in modules:
                      if module in sys.stdlib_module_names or module in third_party:
                          continue
                      assert (root / (module + '.py')).is_file(), (
                          f'Missing local import {module} from {path}')
          print(f'PASS: {len(files)} Python scripts have a complete local import graph')
          PY

      - name: Use Python 3.13 for source D1/R2 writer tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/catalogo/tools/requirements.txt

      - name: Run focused source publishing contracts without Cloudflare writes
        working-directory: services/catalogo/tools
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v \
            test_external_batch_release \
            test_external_batch_012_contract \
            test_external_release_verifier \
            test_new_only_released_preflight \
            test_apply_existing_gallery_promotion \
            test_apply_exact_source_gallery_promotion \
            test_stage_external_media \
            test_staging_checkpoint

      # Test the changed catalog/admin boundaries and production build.
      # The full monorepo suite belongs to the existing main-push jobs;
      # do not re-run 3,500 unrelated tests for every candidate correction.
      - name: Verify canonical TONART catalog/admin candidate
        if: github.event.pull_request.number == 26 && github.head_ref == 'feat/catalog-editorial-authenticated-submission-20261112'
        run: |
          npm run typecheck
          npm run lint
          npm run security:supabase-access
          npm run build
          npx vitest run src/pages/commercial/TonartAdminCatalogReview.test.tsx src/pages/commercial/TonecosAdminHomePage.test.tsx src/services/admin/tonart-admin-workspace-service.test.ts src/services/catalog/tonart-catalog-review-export.test.ts

  # The same quality workflow owns the target release; no parallel writer.
  # Manual main-only activation is blocked until M5 live preflight proves that
  # the original Washington workflow is disabled and all gates are attested.
  catalog-cutover-release:
    name: Existing Cloudflare Worker — controlled M5 handoff
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'worker-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WORKER_VERSION_TAG: tonart-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout canonical TONART main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend and backend test dependencies
        run: npm ci

      - name: Verify exact authority and single-writer cutover gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CATALOG_API_URL"
          test -n "$TURNSTILE_SECRET_KEY"
          node scripts/catalog/cutover-readiness.mjs --live

      - name: Verify canonical Worker source and offline runtime
        run: |
          npm run catalog:monorepo:check
          npm run catalog:worker:typecheck
          npm run catalog:worker:test

      # Wrangler's release version is pinned exactly to the current known-good
      # original publisher. CI does not add a second package.json or lockfile.
      - name: Install pinned Worker publisher (release job only)
        run: npm install --no-save --package-lock=false wrangler@4.155.0

      - name: Render exact existing Worker and check remote bindings
        working-directory: services/catalogo
        run: |
          set -euo pipefail
          node tools/render_wrangler_config.mjs
          node tools/check_remote_worker_config.mjs --allow-cors-expansion
          previous="$(node tools/cloudflare_deploy_state.mjs active-version)"
          echo "PREVIOUS_WORKER_VERSION_ID=$previous" >> "$GITHUB_ENV"
          npx wrangler r2 bucket info tonecos-catalogo-media --json

      - name: Upload candidate without traffic or D1 migrations
        working-directory: services/catalogo
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/tonart-worker-upload.ndjson
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/tonart-worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node -e "const fs=require('node:fs');fs.writeFileSync(process.argv[1], JSON.stringify({ TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY }), { mode:0o600 })" "$secret_file"
          npx wrangler versions upload \
            --tag "$WORKER_VERSION_TAG" \
            --message "tonart ${GITHUB_SHA}" \
            --secrets-file "$secret_file" \
            --config .wrangler.deploy.jsonc
          staged="$(node tools/cloudflare_deploy_state.mjs uploaded-version "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "STAGED_WORKER_VERSION_ID=$staged" >> "$GITHUB_ENV"

      - name: Register candidate at 0% traffic
        id: stage
        working-directory: services/catalogo
        run: >-
          npx wrangler versions deploy
          "${PREVIOUS_WORKER_VERSION_ID}@100%"
          "${STAGED_WORKER_VERSION_ID}@0%"
          --message "tonart staged ${GITHUB_SHA}"
          --yes --config .wrangler.deploy.jsonc

      - name: Smoke new version before promotion
        working-directory: services/catalogo
        run: node tools/check_staged_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"

      - name: Promote one Worker version
        working-directory: services/catalogo
        run: >-
          npx wrangler versions deploy
          "${STAGED_WORKER_VERSION_ID}@100%"
          --message "tonart ${GITHUB_SHA}"
          --yes --config .wrangler.deploy.jsonc

      - name: Verify production, canonical media and Cache HIT
        working-directory: services/catalogo
        run: |
          node tools/check_remote_worker_config.mjs
          node tools/check_promoted_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"
          python tools/verify_public_catalog.py --api-base "$CATALOG_API_URL"
          node tools/check_public_catalog_hierarchy.mjs "$CATALOG_API_URL"
          node tools/check_worker_cache_hit.mjs "$CATALOG_API_URL"

      - name: Restore previous version on failed promotion or smoke
        if: ${{ failure() && steps.stage.outcome == 'success' }}
        working-directory: services/catalogo
        run: >-
          npx wrangler rollback "$PREVIOUS_WORKER_VERSION_ID"
          --message "tonart rollback after failed validation ${GITHUB_SHA}"
          --config .wrangler.deploy.jsonc

  # The existing quality workflow is the only production writer in TONART.
  # Approved labels change D1 in one conditional SQLite statement; no new
  # Worker or D1/R2 resources are created and migrations are never invoked.
  catalog-editorial-apply:
    name: Approved editorial names — existing D1
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.repo.full_name == 'tonecosstudio/tonecosstudio' &&
      github.event.pull_request.head.repo.full_name == 'tonecosstudio/tonecosstudio' &&
      github.event.pull_request.head.ref == 'editorial/tonart-admin-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      pull-requests: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout reviewed canonical TONART main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify cutover, single authority and exact D1 bindings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/catalog/cutover-readiness.mjs --live

      - name: Atomically apply the reviewed and approved editorial PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --test scripts/catalog/apply-approved-editorial.test.mjs
          node scripts/catalog/apply-approved-editorial.mjs --pr "${{ github.event.pull_request.number }}" --apply

  catalog-batch-preflight:
    name: Reviewed external batch (dry-run) — existing D1/R2
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'data-batch-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/catalogo
    env:
      BATCH_DESCRIPTOR: ${{ inputs.batch }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify M5 complete and unique TONART publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/catalog/cutover-readiness.mjs" --live
          node -e "const m=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_WORKSPACE+'/config/catalog-code-consolidation.json','utf8')); if(m.migration.phase!=='cutover-complete'||m.activeWorkerPublisher!=='tonecosstudio/tonecosstudio')process.exit(1)"

      - name: Install
        run: |
          python -m pip install -r tools/requirements.txt
          npm ci --prefix "$GITHUB_WORKSPACE"
          npm --prefix "$GITHUB_WORKSPACE" install --no-save --package-lock=false wrangler@4.155.0
      - name: Export canonical bindings and batch contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
          python - "$BATCH_DESCRIPTOR" "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          descriptor=Path(sys.argv[1]).resolve()
          if not descriptor.is_relative_to(Path('config/external-batches').resolve()) or descriptor.suffix != '.json':
              raise SystemExit('batch descriptor outside canonical TONART config')
          data=json.loads(descriptor.read_text(encoding='utf-8'))
          staging=str(data.get('stagingBucket') or '').strip()
          production=str(data.get('productionBucket') or '').strip()
          if staging != 'tonecos-catalogo-staging' or production != 'tonecos-catalogo-media':
              raise SystemExit('invalid staging/production bucket contract')
          with open(sys.argv[2], 'a', encoding='utf-8') as handle:
              handle.write(f'BATCH_STAGING_BUCKET={staging}\n')
              handle.write(f'BATCH_PRODUCTION_BUCKET={production}\n')
          PY
      - name: Run focused external-release tests
        working-directory: services/catalogo/tools
        run: >-
          python -m unittest -v
          test_external_batch_release.py
          test_external_batch_012_contract.py
          test_external_release_verifier.py
          test_new_only_released_preflight.py
      - name: Materialize reviewed bytes from private staging
        run: >-
          python tools/materialize_external_media_batch.py "$BATCH_DESCRIPTOR"
          --output "$RUNNER_TEMP/external-batch"
      - name: Build audited ingest manifest
        run: >-
          python tools/ingest_catalog.py "$RUNNER_TEMP/external-batch/source"
          --output "$RUNNER_TEMP/external-batch/ingest"
          --audit-registry "$RUNNER_TEMP/external-batch/audit-registry.csv"
          --no-resume
      - name: Build only the reviewed media delta
        run: >-
          python tools/build_media_bundle.py "$RUNNER_TEMP/external-batch/source"
          "$RUNNER_TEMP/external-batch/ingest/manifest.jsonl"
          --output "$RUNNER_TEMP/external-batch/bundle"
          --workers 4
      - name: Assert exact batch identity contract
        shell: bash
        run: |
          python - "$BATCH_DESCRIPTOR" "$RUNNER_TEMP/external-batch/bundle/models.jsonl" <<'PY'
          import json, sys
          from pathlib import Path
          descriptor=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          models=[json.loads(line) for line in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines() if line.strip()]
          expected={str(row['expectedModelId']): row for row in descriptor['products']}
          actual={str(row['id']): row for row in models}
          assert len(models)==int(descriptor['expectedProducts'])
          assert sum(int(row['imageCount']) for row in models)==int(descriptor['expectedImages'])
          assert set(actual)==set(expected), (sorted(actual), sorted(expected))
          for model_id, contract in expected.items():
              row=actual[model_id]
              checks={
                  'identityKey': contract['expectedIdentityKey'],
                  'slug': contract['expectedSlug'],
                  'code': contract['expectedCode'],
                  'displayName': contract['displayName'],
                  'imageCount': int(contract['expectedImages']),
              }
              for field, value in checks.items():
                  if row[field] != value:
                      raise AssertionError((model_id, field, row[field], value))
          print(json.dumps({'models':len(models),'images':sum(int(r['imageCount']) for r in models),'ids':sorted(actual)}, ensure_ascii=False))
          PY
      - name: R2 delta dry-run
        run: >-
          python tools/publish_r2_wrangler.py "$RUNNER_TEMP/external-batch/bundle/r2"
          --bucket "$BATCH_PRODUCTION_BUCKET"
      - name: Protect D1 quota before batch preflight
        run: python tools/check_d1_editorial_audit_budget.py
      - name: D1 new-only production preflight
        run: python tools/publish_d1_new_models.py "$RUNNER_TEMP/external-batch/bundle/models.jsonl"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-batch-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-batch/materialize-summary.json
            ${{ runner.temp }}/external-batch/ingest/summary.json
            ${{ runner.temp }}/external-batch/bundle/models.jsonl
            ${{ runner.temp }}/external-batch/bundle/publish-summary.json
          if-no-files-found: error
          retention-days: 3

  catalog-batch-apply:
    name: Publish approved external batch — existing D1/R2
    needs: catalog-batch-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'data-batch-release' && inputs.apply == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/catalogo
    env:
      BATCH_DESCRIPTOR: ${{ inputs.batch }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify M5 complete and unique TONART publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/catalog/cutover-readiness.mjs" --live
          node -e "const m=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_WORKSPACE+'/config/catalog-code-consolidation.json','utf8')); if(m.migration.phase!=='cutover-complete'||m.activeWorkerPublisher!=='tonecosstudio/tonecosstudio')process.exit(1)"

      - name: Install
        run: |
          python -m pip install -r tools/requirements.txt
          npm ci --prefix "$GITHUB_WORKSPACE"
          npm --prefix "$GITHUB_WORKSPACE" install --no-save --package-lock=false wrangler@4.155.0
      - name: Export canonical bindings and batch contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
          test -n "$CATALOG_API_URL" || { echo '::error::VITE_API_BASE_URL ausente'; exit 1; }
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
          python - "$BATCH_DESCRIPTOR" "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          descriptor=Path(sys.argv[1]).resolve()
          if not descriptor.is_relative_to(Path('config/external-batches').resolve()) or descriptor.suffix != '.json':
              raise SystemExit('batch descriptor outside canonical TONART config')
          data=json.loads(descriptor.read_text(encoding='utf-8'))
          staging=str(data.get('stagingBucket') or '').strip()
          production=str(data.get('productionBucket') or '').strip()
          if staging != 'tonecos-catalogo-staging' or production != 'tonecos-catalogo-media':
              raise SystemExit('invalid staging/production bucket contract')
          with open(sys.argv[2], 'a', encoding='utf-8') as handle:
              handle.write(f'BATCH_STAGING_BUCKET={staging}\n')
              handle.write(f'BATCH_PRODUCTION_BUCKET={production}\n')
          PY
      - name: Re-materialize and re-verify staged bytes
        run: >-
          python tools/materialize_external_media_batch.py "$BATCH_DESCRIPTOR"
          --output "$RUNNER_TEMP/external-batch"
      - name: Rebuild audited delta
        shell: bash
        run: |
          set -euo pipefail
          python tools/ingest_catalog.py "$RUNNER_TEMP/external-batch/source" \
            --output "$RUNNER_TEMP/external-batch/ingest" \
            --audit-registry "$RUNNER_TEMP/external-batch/audit-registry.csv" \
            --no-resume
          python tools/build_media_bundle.py "$RUNNER_TEMP/external-batch/source" \
            "$RUNNER_TEMP/external-batch/ingest/manifest.jsonl" \
            --output "$RUNNER_TEMP/external-batch/bundle" \
            --workers 4
      - name: Assert exact batch identity contract again
        shell: bash
        run: |
          python - "$BATCH_DESCRIPTOR" "$RUNNER_TEMP/external-batch/bundle/models.jsonl" <<'PY'
          import json, sys
          from pathlib import Path
          descriptor=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          models=[json.loads(line) for line in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines() if line.strip()]
          expected={str(row['expectedModelId']): row for row in descriptor['products']}
          actual={str(row['id']): row for row in models}
          assert set(actual)==set(expected)
          assert len(actual)==int(descriptor['expectedProducts'])
          assert sum(int(row['imageCount']) for row in models)==int(descriptor['expectedImages'])
          for model_id, contract in expected.items():
              row=actual[model_id]
              assert row['identityKey']==contract['expectedIdentityKey']
              assert row['slug']==contract['expectedSlug']
              assert row['code']==contract['expectedCode']
              assert row['displayName']==contract['displayName']
              assert int(row['imageCount'])==int(contract['expectedImages'])
          PY
      - name: Recheck D1 quota before batch release
        run: python tools/check_d1_editorial_audit_budget.py
      - name: Re-check D1 new-only immediately before R2 write
        run: python tools/publish_d1_new_models.py "$RUNNER_TEMP/external-batch/bundle/models.jsonl"
      - name: Publish and verify R2 delta
        run: >-
          python tools/publish_r2_wrangler.py "$RUNNER_TEMP/external-batch/bundle/r2"
          --bucket "$BATCH_PRODUCTION_BUCKET"
          --apply
          --api-base "$CATALOG_API_URL"
          --proof "$RUNNER_TEMP/external-batch/r2-proof.json"
      - name: Recheck D1 quota before atomic model write
        run: python tools/check_d1_editorial_audit_budget.py
      - name: Apply strictly new-only D1 delta atomically
        run: >-
          python tools/publish_d1_new_models.py "$RUNNER_TEMP/external-batch/bundle/models.jsonl"
          --apply
          --r2-proof "$RUNNER_TEMP/external-batch/r2-proof.json"
          --expected-r2-bucket "$BATCH_PRODUCTION_BUCKET"
      - name: Verify general public catalog health
        run: python tools/verify_public_catalog.py --api-base "$CATALOG_API_URL"
      - name: Verify all released models and galleries
        run: >-
          python tools/verify_external_batch_release.py "$RUNNER_TEMP/external-batch/bundle/models.jsonl"
          --api-base "$CATALOG_API_URL"
      - name: Upload release proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-batch-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-batch/materialize-summary.json
            ${{ runner.temp }}/external-batch/bundle/models.jsonl
            ${{ runner.temp }}/external-batch/bundle/publish-summary.json
            ${{ runner.temp }}/external-batch/r2-proof.json
          if-no-files-found: warn
          retention-days: 7
